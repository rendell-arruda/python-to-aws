<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWS Lambda Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .container {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
      }
      h1 {
        text-align: center;
        color: #333;
      }
      label {
        display: block;
        margin: 10px 0 5px;
        color: #555;
      }
      input,
      select,
      button {
        width: 100%;
        padding: 10px;
        margin: 5px 0 15px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      button {
        background-color: #007bff;
        color: #fff;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>AWS Lambda Form</h1>
      <form id="lambdaForm">
        <label for="accountId">Account ID:</label>
        <input type="text" id="accountId" name="accountId" required /><br />

        <label for="secretKey">Secret Key:</label>
        <input type="password" id="secretKey" name="secretKey" required /><br />

        <label for="resourceName">Resource Name:</label>
        <input
          type="text"
          id="resourceName"
          name="resourceName"
          required
        /><br />

        <label for="region">Region:</label>
        <select id="region" name="region" required>
          <option value="us-east-1">us-east-1</option>
          <option value="us-west-2">us-west-2</option>
          <!-- Adicione mais regiões conforme necessário --></select
        ><br />

        <label for="scheduleValue">Schedule Value:</label>
        <select id="scheduleValue" name="scheduleValue" required>
          <option value="running">running</option>
          <option value="stopped">stopped</option></select
        ><br />

        <button type="submit">Submit</button>
      </form>
    </div>

    <script>
      document
        .getElementById('lambdaForm')
        .addEventListener('submit', async function (event) {
          event.preventDefault();

          const formData = {
            accountId: document.getElementById('accountId').value,
            secretKey: document.getElementById('secretKey').value,
            resourceName: document.getElementById('resourceName').value,
            region: document.getElementById('region').value,
            scheduleValue: document.getElementById('scheduleValue').value
          };

          try {
            const response = await fetch(
              'https://ys1kobyek0.execute-api.us-east-1.amazonaws.com/change-template',
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
              }
            );

            const result = await response.json();
            console.log(result);
            alert('Form submitted successfully!');
          } catch (error) {
            console.error('Error submitting form:', error);
            alert('Error submitting form.');
          }
        });
    </script>
  </body>
</html>
